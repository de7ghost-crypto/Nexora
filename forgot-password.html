<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Nexora</title>
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a href="index.html" class="logo">Nexora</a>
        <h1>Forgot Password</h1>
        <p class="auth-sub">Enter your email to receive reset link</p>
        <form action="#" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" placeholder="Enter your email">
            </div>
            <button type="submit" class="auth-btn">Send Reset Link</button>
        </form>
        <ol class="reset-step">
            <li>Check your inbox for an email from Nexora.</li>
            <li>Click the reset link inside it.</li>
            <li>Choose a new password and log in.</li>
        </ol>
        <p class="auth-switch"><a href="login.html">Back to login</a></p>
    </main>
</body>
</html>
